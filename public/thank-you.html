<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanks | Complete Trade Solutions</title>
    <style>
      :root {
        color: #111111;
        background: #f2f2f0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 680px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 7vw, 4.5rem);
        line-height: 0.95;
      }

      p {
        margin: 24px auto 0;
        max-width: 520px;
        color: #5c5c5c;
        font-size: 1.125rem;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        margin-top: 32px;
        border-radius: 999px;
        background: #111111;
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 900;
        letter-spacing: 0.12em;
        padding: 16px 28px;
        text-decoration: none;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Thanks, we got your enquiry.</h1>
      <p>
        Complete Trade Solutions will review your message and get back to you
        shortly.
      </p>
      <a href="/">Back to site</a>
    </main>
  </body>
</html>
